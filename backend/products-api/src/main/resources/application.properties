# --- H2 ---
spring.datasource.url=jdbc:h2:file:./data/productsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Archivos
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# Logs JPA
spring.jpa.show-sql=true

# Puerto
server.port=8080

# CORS simple
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*
spring.web.cors.exposed-headers=Authorization

# --- JWT (usa JwtUtil con security.*) ---
# 7 días en milisegundos (NO poner comentarios en la misma línea)
security.jwt.secret=CAMBIA_ESTE_SECRETO_POR_UNA_CADENA_MUY_LARGA_DE_64_128_CHARS_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
security.jwt.expirationMs=604800000


