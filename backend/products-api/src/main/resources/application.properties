# H2
spring.config.import=optional:file:.env.properties,optional:file:./backend/products-api/.env.properties,optional:file:../backend/products-api/.env.properties
spring.datasource.url=jdbc:h2:file:./data/productsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Files
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# JPA logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# CORS
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*
spring.web.cors.exposed-headers=Authorization

# JWT (used by JwtUtil with security.*)
security.jwt.secret=CAMBIA_ESTE_SECRETO_POR_UNA_CADENA_MUY_LARGA_DE_64_128_CHARS_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
security.jwt.expirationMs=604800000

# Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:liamnahuelromero@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Reservation confirmation email
app.reservations.email.enabled=${RESERVATION_EMAIL_ENABLED:true}
app.reservations.email.from=${MAIL_FROM:${MAIL_USERNAME:liamnahuelromero@gmail.com}}
app.reservations.email.provider-contact-name=Soporte Turmalin
app.reservations.email.provider-contact-email=soporte@turmalin.com
app.reservations.email.provider-contact-phone=+54 11 4000-0000

